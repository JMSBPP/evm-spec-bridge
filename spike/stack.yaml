# THROWAWAY spike configuration -- deleted in plan 02-05 along with the rest of
# spike/. This is a SELF-CONTAINED Stack project: it is deliberately NOT listed
# in the root stack.yaml, so CI never builds it and deleting it is `rm -rf spike/`
# plus one justfile recipe.
#
# The snapshot block below is byte-identical to the root stack.yaml's. The URL
# form is used rather than the `lts-24.55` shorthand for the same reason the
# root uses it: shorthand would let the two trees drift onto different snapshot
# revisions silently.
snapshot:
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/24/55.yaml
  sha256: 1c2140555bdf61c30a893b3ec1033987d01eda75ce82a1dda033e8fb6f8b322c
  size: 732456

packages:
- stub-server

# warp-3.4.9, wai-3.2.5, http-types-0.12.6, aeson, bytestring and text are all
# in LTS 24.55. Nothing needs pinning outside the snapshot.
extra-deps: []

system-ghc: true
install-ghc: false
