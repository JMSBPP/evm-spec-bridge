name:        evm-spec-bridge-registry
version:     0.1.0.0
synopsis:    Method registry — the schema source of truth for codegen
license:     BSD-3-Clause
author:      JMSBPP
maintainer:  juan.serranotmf@gmail.com
copyright:   2026 JMSBPP

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

dependencies:
- base >= 4.7 && < 5
- aeson
- bytestring
- scientific
- text
- vector
- json-rpc
- web3-solidity
- evm-spec-bridge-protocol
- evm-spec-bridge-abi-codec
- evm-spec-bridge-jsonrpc

library:
  source-dirs: src

tests:
  registry-test:
    main:        Main.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - evm-spec-bridge-registry
    - evm-spec-bridge-protocol
    - evm-spec-bridge-abi-codec
    - evm-spec-bridge-jsonrpc
    - tasty
    - tasty-hunit
    - aeson
    - bytestring
    - text
