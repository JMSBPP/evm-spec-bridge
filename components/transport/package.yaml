name:        evm-spec-bridge-transport
version:     0.1.0.0
synopsis:    Loopback HTTP server carrying the oracle
license:     BSD-3-Clause
author:      JMSBPP
maintainer:  juan.serranotmf@gmail.com
copyright:   2026 JMSBPP

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

dependencies:
- base >= 4.7 && < 5

library:
  source-dirs: src
  dependencies:
  - aeson
  - bytestring
  - containers
  - scientific
  - text
  - wai
  - warp
  - http-types
  - json-rpc
  - evm-spec-bridge-registry
  - evm-spec-bridge-jsonrpc

tests:
  transport-test:
    main:        Main.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - evm-spec-bridge-transport
    - evm-spec-bridge-registry
    - evm-spec-bridge-jsonrpc
    - json-rpc
    - tasty
    - tasty-hunit
    - aeson
    - bytestring
    - text

executables:
  evm-spec-bridge:
    main:        Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - evm-spec-bridge-transport
