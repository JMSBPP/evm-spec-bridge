name:        evm-spec-bridge-abi-codec
version:     0.1.0.0
synopsis:    Hex and ABI encoding for the tagged result envelope
license:     BSD-3-Clause
author:      JMSBPP
maintainer:  juan.serranotmf@gmail.com
copyright:   2026 JMSBPP

# Mirrors the spec repo's flag set so both trees fail on the same things.
ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

dependencies:
- base >= 4.7 && < 5
- aeson
- bytestring
- text
- base16-bytestring
- evm-spec-bridge-protocol
# Data.Solidity.Abi.Codec -- the ABI encoder for the hex envelope (03-03).
# Snapshot-resident in LTS 24.55 at 1.1.0.0, so NO extra-deps entry is needed.
# NOT `web3`: that is a meta-package pulling web3-ethereum, web3-provider AND
# web3-polkadot, and `Data.Solidity` is in none of them.
# MEASURED: no extra-libraries and no pkgconfig-depends in web3-solidity or its
# dependency web3-crypto (whose xxhash.c is vendored as c-sources), so the
# container image needs nothing new.
- web3-solidity

library:
  source-dirs: src
