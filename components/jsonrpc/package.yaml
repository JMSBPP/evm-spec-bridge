name:        evm-spec-bridge-jsonrpc
version:     0.1.0.0
synopsis:    JSON-RPC 2.0 envelope, hand-rolled to own the error channel
license:     BSD-3-Clause
author:      JMSBPP
maintainer:  juan.serranotmf@gmail.com
copyright:   2026 JMSBPP

# Mirrors the spec repo's flag set so both trees fail on the same things.
ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

dependencies:
- base >= 4.7 && < 5
- aeson
- bytestring
- text
- json-rpc
- evm-spec-bridge-protocol
- evm-spec-bridge-abi-codec

library:
  source-dirs: src

tests:
  jsonrpc-test:
    main:        Main.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - evm-spec-bridge-jsonrpc
    - evm-spec-bridge-protocol
    - evm-spec-bridge-abi-codec
    - tasty
    - tasty-hunit
    - aeson
    - bytestring
    - text
