name: CI

# Push AND pull_request, deliberately. The consumer's gate is PR-only, which is
# why their try/catch experiment costs them a branch and a PR just to see a
# result. Gating on push means a feat/* branch is validated while the work is
# happening. Cost, stated rather than discovered: a same-repo PR builds every
# commit twice, under different concurrency groups.
on: [push, pull_request]

permissions:
  contents: read        # widened to packages:write in the image job ONLY (01-08)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STACK_FLAGS: ""       # system-ghc is made global below, so no per-command flags

jobs:
  # CFMM-01. Separated from build on LATENCY grounds, not tidiness -- but see
  # the cache step: this is only fast when .stack-work is warm (~0.3s). A COLD
  # tree costs ~119s (measured). CI always starts cold, so the cache MUST be
  # restored before this job runs or the fail-fast property is fiction.
  seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'      # inherited from LTS 24.55, not chosen
          stack-version: '3.11.1'    # pinned: bundles hpack 0.39.6
          enable-stack: true
      # haskell-actions/setup does NOT write system-ghc into any Stack config.
      # Stack defaults to system-ghc:false/install-ghc:true, so a bare `stack`
      # in scripts/ would download its own GHC -- inside the job whose entire
      # thesis is "0.3 seconds".
      - name: Make system-GHC the global default
        run: |
          stack config set system-ghc true --global
          stack config set install-ghc false --global
      - name: Restore Stack cache BEFORE the guard
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
            components/*/.stack-work
          # The run_id suffix is load-bearing: Actions caches are IMMUTABLE
          # ("you cannot change the contents of an existing cache"). Without it
          # the hashFiles inputs stop changing and the first, cold cache is
          # frozen for 7 days. restore-keys still matches the prefix.
          key: stack-${{ runner.os }}-ghc9.10.3-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'components/*/package.yaml') }}-${{ github.run_id }}
          restore-keys: stack-${{ runner.os }}-ghc9.10.3-
      - name: Seam guard (CFMM-01)
        run: ./scripts/seam-guard.sh
      - name: Prove the guard fires
        run: ./scripts/seam-negative-test.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          stack-version: '3.11.1'
          enable-stack: true
      - name: Make system-GHC the global default
        run: |
          stack config set system-ghc true --global
          stack config set install-ghc false --global
      # MEASURED, not inherited: building cfmm-adapter without these fails with
      # `[S-7011] While building package cairo-0.13.12.0`. The spec's core/plot
      # split does NOT remove this for a git extra-dep, because Stack builds all
      # components of a source package.
      - name: Native deps for the spec's plotting chain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
            components/*/.stack-work
          key: stack-${{ runner.os }}-ghc9.10.3-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'components/*/package.yaml') }}-${{ github.run_id }}
          restore-keys: stack-${{ runner.os }}-ghc9.10.3-
      # --pedantic on BOTH builds or neither: it adds -Wall -Werror to local
      # packages, changing their configure hash. Dropping it for a second build
      # forces a full recompile, so a "warm" number would be a recompile time
      # wearing an incremental label.
      - name: Cold build
        run: |
          S=$(date +%s)
          stack build --test --no-run-tests --pedantic
          echo "T_COLD=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
      - name: Warm rebuild (same flags)
        run: |
          S=$(date +%s)
          stack build --test --no-run-tests --pedantic
          echo "T_WARM=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
      - name: Tests
        run: stack test --pedantic
      - name: hpack drift gate
        run: ./scripts/hpack-drift.sh
      - name: Record build times
        if: always()
        run: |
          {
            echo "| metric | value |"
            echo "|---|---|"
            echo "| cold build | ${T_COLD:-unmeasured}s |"
            echo "| warm rebuild | ${T_WARM:-unmeasured}s |"
            echo "| ~/.stack | $(du -sh ~/.stack 2>/dev/null | cut -f1) |"
            echo "| .stack-work | $(du -sh .stack-work 2>/dev/null | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- image ---
  # DIST-04. The container image is the distribution artifact: the consumer runs
  # it rather than building it, so their runner needs no Haskell toolchain.
  image:
    needs: [seam, build]          # do not spend image minutes on an already-red tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write             # appears EXACTLY once, in this job only
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # An OCI tag MUST match [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127} -- NO SLASH.
      # github.ref_name is `develop` on a develop push, `feat/x` on a feature
      # push and `<pr>/merge` on a pull_request. Using it raw fails at tag-parse
      # time on every PR and every feat/* push -- i.e. everywhere except the one
      # path a naive test exercises.
      # `github.repository` is also unusable as an image ref: JMSBPP has capitals.
      - name: Compute lowercase image ref and a slash-free tag
        id: meta
        run: |
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"
          echo "safe=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      # A PR from a FORK gets a read-only GITHUB_TOKEN: packages:write is
      # silently downgraded and the push 403s. There is no setting that rescues
      # this on public repos. So: build on every trigger, push only on `push`.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (always) and push (push events only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: true              # so the smoke test below runs the LOCAL image
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.safe }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      # A Dockerfile that builds but produces a binary that cannot start is a
      # false green. `load: true` guarantees this is the local image, not a
      # registry round-trip.
      - name: Smoke -- the shipped binary runs
        run: docker run --rm ${{ steps.meta.outputs.image }}:sha-${{ github.sha }} --version
