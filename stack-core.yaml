# SEAM GUARD (CFMM-01). This file is a proposition, not a build:
#   "the six core components are satisfiable from the snapshot alone."
#
# It omits the adapter package AND the spec extra-dep. A core component that
# gains a dependency on the spec therefore fails to RESOLVE here:
#   Error: [S-4804] Stack failed to construct a build plan.
# naming the offending package, the offending dependency, and this file.
# Measured: exit 1 in 0.34s, before anything compiles. See
# scripts/seam-negative-test.sh, which proves the guard actually fires.
#
# Why not "stack build <core targets>" against the full config instead: that
# does NOT fail. Stack would resolve the spec from extra-deps and build it
# happily. The guard has to make the dependency UNAVAILABLE, not merely
# unrequested.
#
# No lock file is needed: with extra-deps empty, the snapshot URL is the only
# thing to lock, and stack.yaml.lock already records its hash.
snapshot:
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/24/55.yaml
  sha256: 1c2140555bdf61c30a893b3ec1033987d01eda75ce82a1dda033e8fb6f8b322c
  size: 732456

packages:
- components/protocol
- components/abi-codec
- components/jsonrpc
- components/oracle-stub
- components/registry
- components/transport
- components/codegen

extra-deps: []

system-ghc: true
install-ghc: false
